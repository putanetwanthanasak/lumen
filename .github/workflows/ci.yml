name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  UV_VERSION: "0.12.20"

jobs:
  test:
    name: Lint, type-check, test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.10
        env:
          # Throwaway CI-only credentials for an ephemeral container. Not secrets.
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: lumen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d lumen_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/lumen_test
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/lumen_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies (from lock)
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy app
      - name: Pytest with coverage (80% floor)
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80
      # Money-critical modules get a stricter floor, read from the same coverage data.
      # One step per module, so a weak module cannot hide behind a strong one.
      # TODO: add app/savings once it exists.
      - name: Coverage gate app/rules (90% floor)
        run: uv run coverage report --include='app/rules/*' --fail-under=90
      - name: Coverage gate app/webhooks (90% floor)
        run: uv run coverage report --include='app/webhooks/*' --fail-under=90

  pip-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Export locked requirements
        run: uv export --frozen --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/req-audit.txt"
      - name: pip-audit
        run: uv run --frozen pip-audit -r "$RUNNER_TEMP/req-audit.txt" --strict --disable-pip

  gitleaks:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum-verified)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan git history
        run: gitleaks git --redact --verbose --exit-code 1 .
