name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  UV_VERSION: "0.12.20"
  NODE_VERSION: "22.22.1"  # as on the laptop; package.json engines needs >= 22.18.0

jobs:
  test:
    name: Lint, type-check, test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.10
        env:
          # Throwaway CI-only credentials for an ephemeral container. Not secrets.
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: lumen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d lumen_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # S2, as on a laptop: the app and the tests connect as lumen_app; only
      # migrations and test clean-up use the superuser.
      LUMEN_APP_PASSWORD: ci_app
      DATABASE_URL: postgresql+psycopg://lumen_app:ci_app@localhost:5432/lumen_test
      TEST_DATABASE_URL: postgresql+psycopg://lumen_app:ci_app@localhost:5432/lumen_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/lumen_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/lumen_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies (from lock)
        run: uv sync --frozen
      # The same script docker compose runs on first init, inside the service container.
      - name: Create the app DB role (S2)
        run: >-
          docker exec -i -e LUMEN_APP_PASSWORD "${{ job.services.postgres.id }}" sh -s
          < ../docker/postgres/init/02-create-app-role.sh
      # The independent-reviewer subagent's read-only hook (.claude/hooks): every case must hold.
      - name: Reviewer hook self-check
        working-directory: .
        run: uv run --no-project python -I .claude/hooks/check_reviewer_hook.py
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy app
      - name: Pytest with coverage (80% floor)
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80
      # Money-critical modules get a stricter floor, read from the same coverage data.
      # One step per module, so a weak module cannot hide behind a strong one.
      - name: Coverage gate app/rules (90% floor)
        run: uv run coverage report --include='app/rules/*' --fail-under=90
      - name: Coverage gate app/webhooks (90% floor)
        run: uv run coverage report --include='app/webhooks/*' --fail-under=90
      - name: Coverage gate app/savings (90% floor)
        run: uv run coverage report --include='app/savings/*' --fail-under=90
      - name: Coverage gate app/ledger (90% floor)
        run: uv run coverage report --include='app/ledger/*' --fail-under=90

  # The KidNee screens (frontend/): the same checks the UI sessions ran locally.
  frontend:
    name: Frontend type-check, test, build, audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies (from lock, no scripts)
        run: npm ci --ignore-scripts
      - name: Type-check
        run: npx --no-install tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: npm audit
        run: npm audit

  pip-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Export locked requirements
        run: uv export --frozen --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/req-audit.txt"
      - name: pip-audit
        run: uv run --frozen pip-audit -r "$RUNNER_TEMP/req-audit.txt" --strict --disable-pip

  gitleaks:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum-verified)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan git history
        run: gitleaks git --redact --verbose --exit-code 1 .
